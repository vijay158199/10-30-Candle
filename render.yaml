services:
  - name: candle-1030-dashboard
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      # Turso (persistent DB - see db.py). Get these from app.turso.tech's
      # database page: connection URL + a generated auth token. MUST be a
      # SEPARATE Turso database from any sibling project's - never point
      # two services at the same TURSO_DATABASE_URL.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Real login credentials - do NOT leave these as the vijay/changeme123
      # defaults once this is reachable on the public internet.
      - key: NIFTY_AUTH_USERNAME
        sync: false
      - key: NIFTY_AUTH_PASSWORD
        sync: false
      # Signs the login session cookie - auto-generated once, then stable
      # across redeploys (unlike the local-file fallback, which wouldn't
      # survive Render's ephemeral disk and would log everyone out on every
      # restart/sleep-wake cycle).
      - key: NIFTY_SESSION_SECRET
        generateValue: true
